<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인생치트키 — 평생총운 (8워커 병렬생성)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171f; --paper:#f6efe0; --paper-2:#efe4cd;
    --gold:#c9a13b; --gold-2:#a17d20;
    --text:#2a2520; --muted:#837a68; --muted-2:#9b9488;
    --line: rgba(42,37,32,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse 900px 500px at 50% -10%, #232a3a 0%, transparent 60%), var(--ink);
    color:var(--paper);font-family:'Noto Sans KR',sans-serif;min-height:100vh;padding:44px 16px 70px;}
  .wrap{max-width:720px;margin:0 auto;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;}
  h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:28px;margin:0 0 8px;}
  .sub{color:#c9c2b3;font-size:14px;margin:0 0 28px;line-height:1.6;}
  .card{background:var(--paper);color:var(--text);border-radius:14px;padding:26px;box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.span2{grid-column:span 2;}
  label{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;}
  input,select{font-family:'Noto Sans KR';font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:7px;background:#fffdf8;color:var(--text);}
  input:focus,select:focus{outline:none;border-color:var(--gold-2);}
  .btn{margin-top:20px;width:100%;background:var(--gold-2);color:#fff8ee;border:none;border-radius:8px;padding:14px;font-size:15.5px;font-weight:700;font-family:'Noto Serif KR',serif;cursor:pointer;}
  .btn:hover{background:#8a6a1a;} .btn:disabled{opacity:.5;cursor:not-allowed;}
  .err{margin-top:10px;padding:8px 12px;background:#fbeae7;color:#8f2f22;border-radius:8px;font-size:12.5px;display:none;}
  .progress{display:none;margin-top:18px;background:var(--paper);border-radius:14px;padding:20px 22px;box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);color:var(--text);}
  .progress.active{display:block;}
  .worker-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
  .worker-row .dot{width:8px;height:8px;border-radius:50%;background:var(--paper-2);flex-shrink:0;}
  .worker-row.done .dot{background:#4a7c4e;}
  .worker-row.loading .dot{background:var(--gold-2);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.3;}}
  .report{display:none;margin-top:18px;background:#fffdf8;color:var(--text);border-radius:14px;padding:30px 32px;box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);}
  .report h2{font-family:'Noto Serif KR',serif;font-size:20px;border-bottom:2px solid var(--gold-2);padding-bottom:10px;margin:28px 0 14px;}
  .report h2:first-child{margin-top:0;}
  .report h3{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--gold-2);margin:18px 0 6px;}
  .report p{font-size:14.5px;line-height:1.85;margin:0 0 10px;white-space:pre-line;}
  .diag-block{background:var(--paper-2);border-left:3px solid var(--gold-2);padding:10px 14px;margin:8px 0 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);line-height:1.7;border-radius:0 6px 6px 0;}
  .charcount{text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-2);margin-top:20px;border-top:1px solid var(--line);padding-top:12px;}

  /* ===== 온보딩 퍼널 스타일 ===== */
  .funnel-progress{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:40px;overflow:hidden;}
  .funnel-progress-bar{height:100%;width:20%;background:var(--gold);transition:width .35s ease;}
  .funnel-card{display:none;text-align:center;padding:20px 10px 40px;animation:fadeSlide .35s ease;}
  .funnel-card.active{display:block;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .funnel-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;}
  .funnel-card h2{font-family:'Noto Serif KR',serif;font-size:22px;line-height:1.5;margin:0 0 28px;color:var(--paper);}
  .funnel-input-text{width:100%;max-width:320px;font-family:'Noto Sans KR';font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--text);text-align:center;}
  .funnel-input-big{width:100%;max-width:280px;font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:.15em;padding:16px;border:2px solid var(--gold-2);border-radius:12px;background:var(--paper);color:var(--text);text-align:center;font-weight:700;}
  .funnel-input-big:focus{outline:none;box-shadow:0 0 0 3px rgba(201,161,59,.35);}
  .funnel-hint{font-size:13px;color:#c9c2b3;margin-top:12px;}
  .toggle-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;}
  .toggle-btn{flex:1;max-width:140px;padding:14px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--paper);font-family:'Noto Sans KR';font-size:15px;font-weight:600;cursor:pointer;transition:.15s;}
  .toggle-btn.selected{background:var(--gold-2);border-color:var(--gold-2);color:#fff8ee;}
  .chip-btn{margin-top:20px;padding:12px 20px;border-radius:100px;border:1.5px dashed var(--gold);background:transparent;color:var(--gold);font-family:'Noto Sans KR';font-size:13.5px;font-weight:600;cursor:pointer;}
  .chip-btn:hover{background:rgba(201,161,59,.12);}
  .focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:380px;margin:0 auto;}
  .focus-btn{padding:22px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);color:var(--text);font-family:'Noto Serif KR';font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
  .focus-btn:hover,.focus-btn.selected{background:var(--gold-2);color:#fff8ee;border-color:var(--gold-2);}
  .funnel-next{max-width:240px;margin:0 auto;}
  .loading-spinner{width:44px;height:44px;border:4px solid var(--paper-2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 20px;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #step-loading{color:var(--paper);}
  #step-loading .worker-row{color:#c9c2b3;justify-content:flex-start;max-width:420px;margin:0 auto;}
  #step-loading .worker-row .dot{background:rgba(255,255,255,.2);}
  .back-btn{position:absolute;top:0;left:0;background:none;border:none;color:var(--muted-2);font-family:'Noto Sans KR';font-size:13px;cursor:pointer;padding:6px 10px;}
  .back-btn:hover{color:var(--paper);}
  .funnel-card{position:relative;}
  .live-results{margin-top:24px;text-align:left;max-height:420px;overflow-y:auto;padding:0 4px;}
  .live-chapter{background:var(--paper);color:var(--text);border-radius:10px;padding:14px 16px;margin-bottom:10px;animation:fadeSlide .3s ease;}
  .live-chapter h4{font-family:'Noto Serif KR';font-size:13.5px;color:var(--gold-2);margin:0 0 6px;display:flex;align-items:center;gap:6px;}
  .live-chapter h4::before{content:"✓";color:#4a7c4e;font-weight:900;}
  .live-chapter .sub-outline{font-size:11.5px;color:var(--muted);line-height:1.8;padding-left:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">saju-content-site · 8워커 병렬생성 v4</div>

  <!-- ===== 온보딩 퍼널: 1문1답 풀스크린 카드 (Progressive Disclosure) ===== -->
  <div id="funnel">
    <div class="funnel-progress"><div class="funnel-progress-bar" id="funnelBar"></div></div>

    <div class="funnel-card active" id="step-1">
      <div class="funnel-eyebrow">STEP 1 / 5</div>
      <h2>분석 리포트에 기록될<br>이름(또는 닉네임)을 알려주세요</h2>
      <input type="text" id="userName" class="funnel-input-text" placeholder="예: 하늘" autofocus>
      <button class="btn funnel-next" data-step="1">다음</button>
    </div>

    <div class="funnel-card" id="step-2">
      <button class="back-btn" data-back="0">← 뒤로</button>
      <div class="funnel-eyebrow">STEP 2 / 5</div>
      <h2>성별과 생일 기준을<br>선택해주세요</h2>
      <div class="toggle-row">
        <button class="toggle-btn selected" data-group="gender" data-value="여">여성</button>
        <button class="toggle-btn" data-group="gender" data-value="남">남성</button>
      </div>
      <div class="toggle-row">
        <button class="toggle-btn selected" data-group="calendar" data-value="solar">양력</button>
        <button class="toggle-btn" data-group="calendar" data-value="lunar">음력</button>
      </div>
      <button class="btn funnel-next" data-step="2">다음</button>
    </div>

    <div class="funnel-card" id="step-3">
      <button class="back-btn" data-back="1">← 뒤로</button>
      <div class="funnel-eyebrow">STEP 3 / 5</div>
      <h2>언제, 어디서 태어나셨나요?</h2>
      <div class="field" style="margin-bottom:18px;max-width:260px;margin-left:auto;margin-right:auto;">
        <label style="color:var(--muted);">출생 도시 (먼저 골라주세요)</label>
        <select id="city">
          <option value="126.98">서울/수도권</option><option value="128.11">경남 진주</option>
          <option value="129.08">부산</option><option value="128.60">대구</option>
          <option value="127.38">대전</option><option value="126.85">광주</option>
          <option value="135.00">모름</option>
        </select>
      </div>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8"
             id="birthDateInput" class="funnel-input-big" placeholder="19951012">
      <p class="funnel-hint" id="dateEcho">&nbsp;</p>
      <div class="err" id="dateErr"></div>
    </div>

    <div class="funnel-card" id="step-4">
      <button class="back-btn" data-back="2">← 뒤로</button>
      <div class="funnel-eyebrow">STEP 4 / 5</div>
      <h2>태어난 시간을 아시나요?</h2>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             id="birthTimeInput" class="funnel-input-big" placeholder="0707 또는 1430">
      <p class="funnel-hint" id="timeEcho">24시간제 4자리 (예: 오전 7시 7분 → 0707)</p>
      <button class="chip-btn" id="timeUnknownBtn">태어난 시간을 몰라요 (삼주 집중 분석)</button>
      <div class="err" id="timeErr"></div>
    </div>

    <div class="funnel-card" id="step-5">
      <button class="back-btn" data-back="3">← 뒤로</button>
      <div class="funnel-eyebrow">STEP 5 / 5</div>
      <h2>현재 인생에서 가장 시급하게<br>뜯어고치고 싶은 문제는?</h2>
      <div class="focus-grid">
        <button class="focus-btn" data-focus="money">💰 돈·투자·사업</button>
        <button class="focus-btn" data-focus="career">💼 이직·커리어</button>
        <button class="focus-btn" data-focus="love">❤️ 연애·결혼</button>
        <button class="focus-btn" data-focus="relation">🤝 인간관계</button>
      </div>
    </div>

    <div class="funnel-card" id="step-loading">
      <div class="loading-spinner"></div>
      <h2 id="loadingText">사주를 분석하고 있어요...</h2>
      <div id="workerList"></div>
      <div id="liveResults" class="live-results"></div>
    </div>

    <div class="err" id="errBox" style="max-width:420px;margin:12px auto 0;"></div>
  </div>

  <div class="report" id="reportBox"></div>
</div>

// ===== 계산 보정 함수 (기존과 동일) =====
function applyLegacyStandardTimeCorrection(dt){
  const start=new Date(1954,2,21,0,30), end=new Date(1961,7,10,0,0);
  if(dt>=start && dt<end) return new Date(dt.getTime()+30*60000);
  return dt;
}
function applyTrueSolarTimeCorrection(dt, lon){
  if(!lon||lon===135) return dt;
  return new Date(dt.getTime()+Math.round((lon-135)*4)*60000);
}
function applyYajasiRule(dt){
  if(dt.getHours()===23 && dt.getMinutes()>=30){const d=new Date(dt);d.setDate(d.getDate()+1);return d;}
  return dt;
}

function setWorkerStatus(id, status){

  row.classList.remove('loading','done');
  if(status) row.classList.add(status);
}

function appendLiveResult(res){
  const container = document.getElementById('liveResults');
  const subTitles = [...res.text.matchAll(/###\s*([^\n]+)/g)].map(m => m[1].trim());
  const el = document.createElement('div');
  el.className = 'live-chapter';
  el.innerHTML = `<h4>${res.title}</h4>` +
    (subTitles.length ? `<div class="sub-outline">${subTitles.map(t=>`· ${t}`).join('<br>')}</div>` : '');
  container.appendChild(el);
  document.getElementById('loadingText').textContent = `${container.children.length}/8개 챕터 완료...`;
}

// ===== 워커 1개 호출 (Gemini 3.6 Flash 규격 + 재시도 로직) =====
async function callWorker(worker){
  setWorkerStatus(worker.id, 'loading');
  const maxRetries = 5;
  const apiKey = typeof GEMINI_API_KEY !== 'undefined' ? GEMINI_API_KEY : (typeof ANTHROPIC_API_KEY !== 'undefined' ? ANTHROPIC_API_KEY : "YOUR_API_KEY_HERE");
  const modelName = "gemini-3.6-flash"; // 최신 활성 모델명으로 지정

  for(let attempt = 0; attempt <= maxRetries; attempt++){
    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: worker.prompt }] }],
          generationConfig: {
            maxOutputTokens: 4000,
            temperature: 0.7
          }
        })
      });

      // 429(Rate Limit) 또는 503(Overloaded) 발생 시 대기 후 재시도
      if(response.status === 429 || response.status === 503){
        if(attempt < maxRetries){
          const waitMs = Math.min(2000 * Math.pow(2, attempt), 20000);
          console.warn(`워커 ${worker.id}: ${response.status} 발생, ${waitMs}ms 후 재시도 (${attempt+1}/${maxRetries})`);
          await new Promise(r => setTimeout(r, waitMs));
          continue;
        }
      }

      if(!response.ok){
        const errText = await response.text().catch(()=>response.statusText);
        throw new Error(`HTTP ${response.status}: ${errText.slice(0,200)}`);
      }

      const data = await response.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
      if(!text) throw new Error("응답이 비어 있음");

      setWorkerStatus(worker.id, 'done');
      const result = { id: worker.id, title: worker.title, text };
      appendLiveResult(result);
      return result;
    }catch(e){
      if(attempt >= maxRetries){
        setWorkerStatus(worker.id, 'done');
        return { id: worker.id, title: worker.title, text: `(생성 실패: ${e.message})` };
      }
      await new Promise(r => setTimeout(r, 1500 * (attempt+1)));
    }
  }
}
// ===== 동시 실행 개수 제한 실행기 (한 번에 최대 3개만 동시 처리) =====
async function runWorkersLimited(workers, limit = 3){
  const results = new Array(workers.length);
  let idx = 0;
  async function worker(){
    while(idx < workers.length){
      const myIdx = idx++;
      results[myIdx] = await callWorker(workers[myIdx]);
    }
  }
  const pool = Array.from({length: Math.min(limit, workers.length)}, () => worker());
  await Promise.all(pool);
  return results;
}

// ===== 온보딩 퍼널 상태 & 로직 =====
const funnelState = { name:'', gender:'여', calendar:'solar', year:null, month:null, day:null,
  timeUnknown:false, hour:12, minute:0, city:126.98, focusArea:null };
const STEP_ORDER = ['step-1','step-2','step-3','step-4','step-5','step-loading'];
let curStepIdx = 0;

function goToStep(idx){
  document.getElementById(STEP_ORDER[curStepIdx]).classList.remove('active');
  curStepIdx = idx;
  document.getElementById(STEP_ORDER[curStepIdx]).classList.add('active');
  document.getElementById('funnelBar').style.width = `${Math.round(((idx)/(STEP_ORDER.length-1))*100)}%`;
}

// 뒤로가기 버튼 (모든 스텝 공통)
document.querySelectorAll('.back-btn').forEach(btn => {
  btn.addEventListener('click', () => goToStep(parseInt(btn.dataset.back, 10)));
});

// STEP1: 이름 입력 → 다음
document.querySelector('[data-step="1"]').addEventListener('click', () => {
  funnelState.name = document.getElementById('userName').value.trim() || '당신';
  goToStep(1);
});

// STEP2: 성별/역법 토글
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    document.querySelectorAll(`.toggle-btn[data-group="${group}"]`).forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    funnelState[group] = btn.dataset.value;
  });
});
document.querySelector('[data-step="2"]').addEventListener('click', () => goToStep(2));

// STEP3: 생년월일 8자리 자동 포커스 이동
const birthDateInput = document.getElementById('birthDateInput');
birthDateInput.addEventListener('input', () => {
  let v = birthDateInput.value.replace(/\D/g,'').slice(0,8);
  birthDateInput.value = v;
  const echo = document.getElementById('dateEcho');
  if(v.length>=4){
    let disp = v.slice(0,4);
    if(v.length>=6) disp += '. '+v.slice(4,6); else if(v.length>4) disp += '. '+v.slice(4);
    if(v.length===8) disp += '. '+v.slice(6,8);
    echo.textContent = disp;
  } else { echo.textContent = '\u00a0'; }

  if(v.length===8){
    const y=parseInt(v.slice(0,4),10), m=parseInt(v.slice(4,6),10), d=parseInt(v.slice(6,8),10);
    const errEl = document.getElementById('dateErr');
    const valid = y>=1900 && y<=2026 && m>=1 && m<=12 && d>=1 && d<=31;
    if(!valid){ errEl.textContent='생년월일을 다시 확인해주세요.'; errEl.style.display='block'; return; }
    errEl.style.display='none';
    funnelState.year=y; funnelState.month=m; funnelState.day=d;
    setTimeout(()=>goToStep(3), 200); // 0.2초 딜레이 후 자동 슬라이드
  }
});
document.getElementById('city').addEventListener('change', e => { funnelState.city = parseFloat(e.target.value); });

// STEP4: 태어난 시간 4자리 자동 포커스 이동 + "몰라요" 버튼
const birthTimeInput = document.getElementById('birthTimeInput');
birthTimeInput.addEventListener('input', () => {
  let v = birthTimeInput.value.replace(/\D/g,'').slice(0,4);
  birthTimeInput.value = v;
  const echo = document.getElementById('timeEcho');
  if(v.length>=2){
    const hh = parseInt(v.slice(0,2),10);
    const ampm = hh<12 ? '오전' : '오후';
    const hh12 = hh%12===0 ? 12 : hh%12;
    echo.textContent = v.length===4 ? `${ampm} ${hh12}:${v.slice(2,4)}` : `${ampm} ${hh12}시...`;
  } else { echo.textContent = '24시간제 4자리 (예: 오전 7시 7분 → 0707)'; }

  if(v.length===4){
    const hh=parseInt(v.slice(0,2),10), mm=parseInt(v.slice(2,4),10);
    const errEl = document.getElementById('timeErr');
    if(hh>23 || mm>59){ errEl.textContent='시간을 다시 확인해주세요.'; errEl.style.display='block'; return; }
    errEl.style.display='none';
    funnelState.timeUnknown=false; funnelState.hour=hh; funnelState.minute=mm;
    setTimeout(()=>goToStep(4), 200);
  }
});
document.getElementById('timeUnknownBtn').addEventListener('click', () => {
  funnelState.timeUnknown = true; funnelState.hour = 12; funnelState.minute = 0;
  goToStep(4);
});

// STEP5: 결핍 타깃팅 선택 → 바로 분석 시작
document.querySelectorAll('.focus-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.focus-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    funnelState.focusArea = btn.dataset.focus;
    setTimeout(runAnalysis, 250);
  });
});

// ===== 분석 실행 (기존 로직 재사용) =====
async function runAnalysis(){
  goToStep(5);
  const errBox = document.getElementById('errBox'); errBox.style.display='none';

  let dt = new Date(funnelState.year, funnelState.month-1, funnelState.day, funnelState.hour, funnelState.minute);
  dt = applyLegacyStandardTimeCorrection(dt);
  dt = applyTrueSolarTimeCorrection(dt, funnelState.city);
  dt = applyYajasiRule(dt);

  let r;
  try{
    r = window.calculateSaju({year:dt.getFullYear(),month:dt.getMonth()+1,day:dt.getDate(),hour:dt.getHours(),minute:dt.getMinutes(),gender:funnelState.gender});
  }catch(e){
    errBox.textContent='계산 오류: '+e.message; errBox.style.display='block';
    goToStep(4); return;
  }

  const masterFact = buildMasterFact(r, !funnelState.timeUnknown);
  masterFact.userName = funnelState.name;       // ★ 이름 반영
  masterFact.focusArea = funnelState.focusArea; // ★ 결핍 타깃팅 반영 (챕터 톤 강조용)

  const workers = buildWorkerPrompts(masterFact);
  renderWorkerList(workers);

  const results = await runWorkersLimited(workers, 3); // 동시 3개씩만 처리 (429 방지)
  results.sort((a,b)=>a.id-b.id);

  const reportBox = document.getElementById('reportBox');
  document.getElementById('funnel').style.display = 'none';
  reportBox.style.display = 'block';
  let html = `<h1 style="font-family:'Noto Serif KR';margin:0 0 4px;">${masterFact.userName}님의 사주 · ${masterFact.dayStemKo}(${masterFact.dayStem}) 일간 · ${masterFact.geukguk}</h1>
    <p style="color:var(--muted);font-size:12px;margin:0 0 20px;">일간 강약 ${masterFact.dayStrength.strength}(${masterFact.dayStrength.score}점) · 병약 취약점: ${masterFact.byeongyakKeyword}${funnelState.timeUnknown ? `<br>⏱ ${LEGAL_NOTICE.daeunMarginNotice}` : ''}</p>`;

  let totalChars = 0;
  results.forEach(res => {
    html += `<h2>${res.title}</h2>`;
    const withDiag = res.text.replace(/\*\*정밀 진단\*\*:([^\n]*)/g, '<div class="diag-block">📊 정밀 진단:$1</div>');
    html += withDiag.split('\n').map(line=>{
      if(line.startsWith('### ')) return `<h3>${line.replace('### ','')}</h3>`;
      if(line.trim()==='') return '';
      return `<p>${line}</p>`;
    }).join('');
    totalChars += res.text.replace(/[#\*\n\s]/g,'').length;
  });

  html += `<div class="charcount">최종 분량(공백/기호 제외): 약 ${totalChars.toLocaleString()}자</div>`;
  html += `<div class="footnote" style="margin-top:24px;border-top:1px solid var(--line-dark);padding-top:16px;font-size:11.5px;color:var(--muted-2);line-height:1.7;">
    ⚠️ ${LEGAL_NOTICE.serviceDisclaimer}
  </div>`;
  reportBox.innerHTML = html;
  reportBox.scrollIntoView({behavior:'smooth'});
}

</script>
